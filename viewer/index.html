<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freezeframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>

  <!-- ── Landing ── -->
  <div id="landing">
    <div id="landing-inner">
      <img id="landing-logo" src="/freezeframe-logo.svg" alt="" aria-hidden="true" />
      <div id="landing-wordmark">FREEZEFRAME</div>
      <label id="upload-zone" for="file-input">
        <input type="file" id="file-input" accept="video/*" tabindex="-1" />
        <span id="upload-label">Upload Video</span>
      </label>
    </div>
  </div>

  <!-- ── Processing ── -->
  <div id="processing">
    <div id="processing-inner">
      <div id="processing-wordmark">FREEZEFRAME</div>
      <div id="processing-steps">
        <div class="p-step" id="step-0">Analyzing footage</div>
        <div class="p-step" id="step-1">Detecting moment</div>
        <div class="p-step" id="step-2">Generating views</div>
        <div class="p-step" id="step-3">Ready</div>
      </div>
    </div>
  </div>

  <!-- ── Viewer ── -->
  <canvas id="viewport"></canvas>
  <div id="viewer-hud">
    <div id="viewer-wordmark">FREEZEFRAME</div>
    <div id="listening-indicator" data-state="idle">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
