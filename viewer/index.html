<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Replay — 4D Sports Viewer</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <canvas id="viewport"></canvas>

  <div id="overlay">
    <div id="header">
      <div id="logo">REPLAY</div>
      <div id="camera-presets">
        <button class="preset-btn active" data-preset="free">Free</button>
        <button class="preset-btn" data-preset="front">Front</button>
        <button class="preset-btn" data-preset="side">Side</button>
        <button class="preset-btn" data-preset="top">Top</button>
      </div>
    </div>

    <div id="loading-screen">
      <div id="loading-content">
        <div id="loading-title">REPLAY</div>
        <div id="loading-bar-track">
          <div id="loading-bar-fill"></div>
        </div>
        <div id="loading-text">Loading scene...</div>
      </div>
    </div>

    <div id="controls-bar">
      <button id="play-btn" title="Space to play/pause">
        <svg id="icon-play" viewBox="0 0 24 24" width="20" height="20"><polygon points="5,3 19,12 5,21" fill="currentColor"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" width="20" height="20" style="display:none"><rect x="5" y="3" width="4" height="18" fill="currentColor"/><rect x="15" y="3" width="4" height="18" fill="currentColor"/></svg>
      </button>
      <div id="timeline-container">
        <input type="range" id="timeline" min="0" max="1" step="1" value="0" />
      </div>
      <div id="frame-info">
        <span id="frame-counter">0 / 0</span>
      </div>
      <div id="speed-control">
        <button class="speed-btn" data-speed="0.25">0.25x</button>
        <button class="speed-btn" data-speed="0.5">0.5x</button>
        <button class="speed-btn active" data-speed="1">1x</button>
        <button class="speed-btn" data-speed="2">2x</button>
      </div>
    </div>

    <div id="stats">
      <span id="fps-counter"></span>
      <span id="splat-counter"></span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
