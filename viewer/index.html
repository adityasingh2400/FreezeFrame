<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freezeframe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>

  <!-- ── Landing ── -->
  <div id="landing">
    <div id="landing-inner">
      <img id="landing-logo" src="/freezeframe-logo.svg" alt="" aria-hidden="true" />
      <div id="landing-wordmark">FREEZEFRAME</div>
      <label id="upload-zone" for="file-input">
        <input type="file" id="file-input" accept="video/*" multiple tabindex="-1" />
        <span id="upload-label">Upload Videos</span>
      </label>
    </div>
  </div>

  <!-- ── Agent View ── -->
  <div id="agent-view">
    <div id="agent-wordmark">FREEZEFRAME</div>
    <div id="orbit-container">

      <!-- Central agent circle -->
      <div id="agent-circle">
        <div id="agent-bars">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>

      <!-- Orbit path (visual ring) -->
      <div id="orbit-ring"></div>

      <!-- Thumbnail slots — JS populates labels and previews -->
      <div class="thumb" id="thumb-0"><span class="thumb-label"></span></div>
      <div class="thumb" id="thumb-1"><span class="thumb-label"></span></div>
      <div class="thumb" id="thumb-2"><span class="thumb-label"></span></div>
      <div class="thumb" id="thumb-3"><span class="thumb-label"></span></div>
      <div class="thumb" id="thumb-4"><span class="thumb-label"></span></div>
    </div>
    <div id="agent-hint">speak to begin</div>
  </div>

  <!-- ── Viewer ── -->
  <canvas id="viewport"></canvas>
  <div id="viewer-hud">
    <div id="viewer-wordmark">FREEZEFRAME</div>
    <div id="viewer-overlay-text" data-mode="output"></div>
    <div id="listening-indicator" data-state="idle">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <!-- ── Live Transcript Strip ── -->
  <div id="transcript-strip">
    <div id="transcript-you" class="transcript-row">
      <span class="transcript-label">YOU</span>
      <span class="transcript-text" id="transcript-you-text"></span>
    </div>
    <div id="transcript-ai" class="transcript-row">
      <span class="transcript-label">GEMINI</span>
      <span class="transcript-text" id="transcript-ai-text"></span>
    </div>
  </div>

  <!-- ── Debug Console ── -->
  <div id="debug-console">
    <div id="debug-header">LIVE TRANSCRIPT <span id="debug-toggle" onclick="document.getElementById('debug-console').classList.toggle('collapsed')">▼</span></div>
    <div id="debug-log"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
