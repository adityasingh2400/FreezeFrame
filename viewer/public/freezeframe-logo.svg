<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7A1B2D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7A1B2D" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background — transparent so CSS bg shows through -->
  <rect width="400" height="300" fill="transparent"/>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="155" rx="90" ry="100" fill="url(#glow)"/>

  <!-- Camera arc -->
  <path
    d="M 68 230 A 148 148 0 0 1 332 230"
    fill="none"
    stroke="#C8A882"
    stroke-width="1"
    stroke-dasharray="4 6"
  />

  <!-- Arc glow -->
  <path
    d="M 68 230 A 148 148 0 0 1 332 230"
    fill="none"
    stroke="#7A1B2D"
    stroke-width="1.5"
    stroke-dasharray="4 6"
    opacity="0.3"
    filter="url(#blur-sm)"
  />

  <!-- Real cameras (far left + right) -->
  <circle cx="68"  cy="230" r="6"   fill="#F5EDE4" stroke="#7A1B2D" stroke-width="1.8"/>
  <circle cx="68"  cy="230" r="2.5" fill="#7A1B2D"/>
  <circle cx="332" cy="230" r="6"   fill="#F5EDE4" stroke="#7A1B2D" stroke-width="1.8"/>
  <circle cx="332" cy="230" r="2.5" fill="#7A1B2D"/>

  <!-- Synthetic cameras (intermediate) -->
  <circle cx="108" cy="165" r="4"   fill="#F5EDE4" stroke="#C8A882" stroke-width="1.2"/>
  <circle cx="108" cy="165" r="1.5" fill="#C8A882"/>
  <circle cx="152" cy="118" r="4"   fill="#F5EDE4" stroke="#C8A882" stroke-width="1.2"/>
  <circle cx="152" cy="118" r="1.5" fill="#C8A882"/>
  <circle cx="200" cy="102" r="4"   fill="#F5EDE4" stroke="#C8A882" stroke-width="1.2"/>
  <circle cx="200" cy="102" r="1.5" fill="#C8A882"/>
  <circle cx="248" cy="118" r="4"   fill="#F5EDE4" stroke="#C8A882" stroke-width="1.2"/>
  <circle cx="248" cy="118" r="1.5" fill="#C8A882"/>
  <circle cx="292" cy="165" r="4"   fill="#F5EDE4" stroke="#C8A882" stroke-width="1.2"/>
  <circle cx="292" cy="165" r="1.5" fill="#C8A882"/>

  <!-- Sight lines -->
  <line x1="68"  y1="230" x2="190" y2="185" stroke="#7A1B2D" stroke-width="0.6" opacity="0.15"/>
  <line x1="332" y1="230" x2="210" y2="185" stroke="#7A1B2D" stroke-width="0.6" opacity="0.15"/>

  <!-- Figure — maroon on cream -->
  <rect x="191" y="165" width="18" height="34" rx="4" fill="#7A1B2D"/>
  <circle cx="200" cy="155" r="10" fill="#7A1B2D"/>

  <!-- Right arm raised -->
  <line x1="209" y1="172" x2="228" y2="148" stroke="#7A1B2D" stroke-width="6" stroke-linecap="round"/>
  <line x1="228" y1="148" x2="234" y2="130" stroke="#7A1B2D" stroke-width="5" stroke-linecap="round"/>

  <!-- Left arm -->
  <line x1="191" y1="175" x2="172" y2="188" stroke="#7A1B2D" stroke-width="5" stroke-linecap="round"/>

  <!-- Right leg -->
  <line x1="202" y1="199" x2="214" y2="226" stroke="#7A1B2D" stroke-width="7" stroke-linecap="round"/>
  <line x1="214" y1="226" x2="208" y2="246" stroke="#7A1B2D" stroke-width="6" stroke-linecap="round"/>

  <!-- Left leg -->
  <line x1="198" y1="199" x2="186" y2="220" stroke="#7A1B2D" stroke-width="7" stroke-linecap="round"/>
  <line x1="186" y1="220" x2="192" y2="242" stroke="#7A1B2D" stroke-width="6" stroke-linecap="round"/>

  <!-- Ball -->
  <circle cx="237" cy="124" r="9" fill="none" stroke="#9A2535" stroke-width="2"/>
  <path d="M 229 122 Q 237 118 245 122" fill="none" stroke="#9A2535" stroke-width="1.2" opacity="0.8"/>
  <path d="M 230 127 Q 237 131 244 127" fill="none" stroke="#9A2535" stroke-width="1.2" opacity="0.8"/>

  <!-- Freeze ticks -->
  <line x1="158" y1="193" x2="168" y2="193" stroke="#7A1B2D" stroke-width="1.5" opacity="0.5"/>
  <line x1="158" y1="199" x2="165" y2="199" stroke="#7A1B2D" stroke-width="1.5" opacity="0.3"/>
  <line x1="158" y1="205" x2="168" y2="205" stroke="#7A1B2D" stroke-width="1.5" opacity="0.5"/>

  <line x1="232" y1="193" x2="242" y2="193" stroke="#7A1B2D" stroke-width="1.5" opacity="0.5"/>
  <line x1="235" y1="199" x2="242" y2="199" stroke="#7A1B2D" stroke-width="1.5" opacity="0.3"/>
  <line x1="232" y1="205" x2="242" y2="205" stroke="#7A1B2D" stroke-width="1.5" opacity="0.5"/>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="250" rx="28" ry="3.5" fill="#7A1B2D" opacity="0.12"/>
</svg>
